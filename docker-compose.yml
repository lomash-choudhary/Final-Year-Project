# Local Qdrant for development.
#   docker compose up -d          # start
#   docker compose logs -f qdrant # tail
#   docker compose down           # stop (data survives in the named volume)
#   docker compose down -v        # stop AND delete all vectors
#
# Dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bovine-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # The image has no curl/wget, so probe the port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  qdrant_storage:
